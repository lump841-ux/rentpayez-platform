<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rent Pay Easy — Organization Admin</title>
<link rel="icon" type="image/png" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="shared.css" />
<style>
  .wrap{max-width:420px;margin:80px auto;padding:0 20px}
  .brand{font-weight:800;font-size:20px;margin-bottom:6px;text-align:center;display:flex;align-items:center;justify-content:center;gap:9px}
  .brand-mark{display:inline-flex;flex-shrink:0}
  .sub{color:var(--ink-3);font-size:13.5px;text-align:center;margin-bottom:28px}
  .tabs{display:flex;gap:8px;margin-bottom:20px}
  .tabs button{flex:1;padding:9px;border-radius:8px;background:transparent;border:1px solid var(--line-2);color:var(--ink-2);font-weight:700;font-size:13px;cursor:pointer}
  .tabs button.active{background:var(--green);color:#fff;border-color:var(--green)}
  .panel{display:none}
  .panel.active{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 100 100" width="26" height="26" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="al-roof" x1="20" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c93e3e"/><stop offset="1" stop-color="#7a1f1f"/></linearGradient>
          <linearGradient id="al-smoke" x1="25" y1="4" x2="42" y2="34" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5bc05b"/><stop offset="1" stop-color="#2d7d2d"/></linearGradient>
        </defs>
        <path d="M22 30 C14 26 30 20 22 15 C15 11 28 6 22 3" stroke="url(#al-smoke)" stroke-width="4.2" fill="none" stroke-linecap="round"/>
        <path d="M34 26 C28 23 38 18 32 15" stroke="url(#al-smoke)" stroke-width="3.4" fill="none" stroke-linecap="round" opacity="0.85"/>
        <rect x="24" y="10" width="15" height="27" fill="url(#al-roof)"/>
        <path d="M50 16 L86 47 L86 81 Q86 86 81 86 L19 86 Q14 86 14 81 L14 47 Z" fill="url(#al-roof)"/>
        <rect x="29" y="49" width="34" height="30" rx="6" fill="#f4f4f2"/>
        <text x="46" y="73" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="30" fill="#111111" text-anchor="middle">R</text>
      </svg>
    </span>
    rentpayez — Organization Admin
  </div>
  <div class="sub">Platform for landlords, property managers &amp; housing authorities</div>

  <div class="tabs">
    <button class="active" id="tabLogin" onclick="showTab('login')">Sign In</button>
    <button id="tabSignup" onclick="showTab('signup')">New Organization</button>
  </div>

  <div class="card panel active" id="panelLogin">
    <div class="field"><label>Email</label><input id="li-email" type="email" placeholder="you@yourcompany.com" /></div>
    <div class="field"><label>Password</label><input id="li-password" type="password" placeholder="••••••••" /></div>
    <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Sign In</button>
    <div id="li-msg"></div>
  </div>

  <div class="card panel" id="panelSignup">
    <div class="field"><label>Organization Name</label><input id="su-org" placeholder="County Housing Authority" /></div>
    <div class="field"><label>Your Name</label><input id="su-name" placeholder="Jane Smith" /></div>
    <div class="field"><label>Your Email</label><input id="su-email" type="email" placeholder="jane@county.gov" /></div>
    <div class="field"><label>Password</label><input id="su-password" type="password" placeholder="At least 8 characters" /></div>
    <button class="btn btn-primary" style="width:100%" onclick="doSignup()">Create Organization</button>
    <div id="su-msg"></div>
  </div>
</div>

<script>
function showTab(t){
  document.getElementById('tabLogin').classList.toggle('active', t==='login');
  document.getElementById('tabSignup').classList.toggle('active', t==='signup');
  document.getElementById('panelLogin').classList.toggle('active', t==='login');
  document.getElementById('panelSignup').classList.toggle('active', t==='signup');
}
async function doLogin(){
  const email = document.getElementById('li-email').value.trim();
  const password = document.getElementById('li-password').value;
  const msg = document.getElementById('li-msg');
  msg.className=''; msg.textContent='';
  try{
    const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email,password}) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Login failed');
    window.location.href = 'console.html';
  }catch(err){ msg.className='err'; msg.textContent = err.message; }
}
async function doSignup(){
  const orgName = document.getElementById('su-org').value.trim();
  const adminName = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim();
  const password = document.getElementById('su-password').value;
  const msg = document.getElementById('su-msg');
  msg.className=''; msg.textContent='';
  try{
    const res = await fetch('/api/auth/signup-organization', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({orgName,adminName,email,password}) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Could not create organization');
    window.location.href = 'console.html';
  }catch(err){ msg.className='err'; msg.textContent = err.message; }
}
</script>
</body>
</html>
