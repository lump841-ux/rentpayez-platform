<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RentPayEZ — Organization Admin</title>
<link rel="icon" type="image/png" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="shared.css" />
<style>
  .wrap{max-width:420px;margin:80px auto;padding:0 20px}
  .brand{font-weight:800;font-size:20px;margin-bottom:6px;text-align:center;display:flex;align-items:center;justify-content:center;gap:2px}
  .brand-mark{display:inline-flex;flex-shrink:0;transform:translateY(-4px)}
  .sub{color:var(--ink-3);font-size:13.5px;text-align:center;margin-bottom:28px}
  .tabs{display:flex;gap:8px;margin-bottom:20px}
  .tabs button{flex:1;padding:9px;border-radius:8px;background:transparent;border:1px solid var(--line-2);color:var(--ink-2);font-weight:700;font-size:13px;cursor:pointer}
  .tabs button.active{background:var(--green);color:#fff;border-color:var(--green)}
  .panel{display:none}
  .panel.active{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="-7 -10 106 106" width="52" height="52" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="al-r1" x1="10" y1="5" x2="95" y2="95" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e8453a"/><stop offset="0.42" stop-color="#a81f18"/><stop offset="1" stop-color="#2a0503"/></linearGradient>
          <linearGradient id="al-g1" x1="0" y1="0" x2="18" y2="26" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4f9530"/><stop offset="1" stop-color="#2c5719"/></linearGradient>
        </defs>
        <path d="M18,26 C17.3,22 18.7,19 18,16 C12,12 24,9 18,5 C12,2 22,0 18,-3" stroke="url(#al-g1)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M22,26 C21.3,22 22.7,19 22,16 C16,12 28,9 22,5 C16,2 26,0 22,-3" stroke="url(#al-g1)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M8,60 L43,29 Q49,24 55,29 L82,53 Q86,57 82,61 Q72,71 59,66 Q50,62 49,53" fill="none" stroke="url(#al-r1)" stroke-width="9.5" stroke-linecap="butt" stroke-linejoin="round"/>
        <circle cx="8" cy="60" r="4.7" fill="url(#al-r1)"/>
        <path d="M10,44 L10,23 L16,19 L24,19 L24,44 Z" fill="url(#al-r1)"/>
        <rect x="31" y="45" width="14" height="42" rx="2" fill="url(#al-r1)"/>
        <path d="M44,60 L86,85 L79,90 L38,66 Z" fill="url(#al-r1)"/>
        <g fill="url(#al-g1)">
          <rect x="50.9" y="42.4" width="4.2" height="4.2" rx="0.8"/>
          <rect x="55.9" y="42.4" width="4.2" height="4.2" rx="0.8"/>
          <rect x="50.9" y="47.4" width="4.2" height="4.2" rx="0.8"/>
          <rect x="55.9" y="47.4" width="4.2" height="4.2" rx="0.8"/>
        </g>
      </svg>
    </span>
    <span class="brand-word"><span class="b1">ent</span><span class="b3">pay</span><span class="b4">ez</span></span> — Organization Admin
  </div>
  <div class="sub">Platform for landlords, property managers &amp; housing authorities</div>

  <div class="tabs">
    <button class="active" id="tabLogin" onclick="showTab('login')">Sign In</button>
    <button id="tabSignup" onclick="showTab('signup')">New Organization</button>
  </div>

  <div class="card panel active" id="panelLogin">
    <div class="field"><label>Email</label><input id="li-email" type="email" placeholder="you@yourcompany.com" /></div>
    <div class="field"><label>Password</label><input id="li-password" type="password" placeholder="••••••••" /></div>
    <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Sign In</button>
    <div id="li-msg"></div>
  </div>

  <div class="card panel" id="panelSignup">
    <div class="field"><label>Organization Name</label><input id="su-org" placeholder="County Housing Authority" /></div>
    <div class="field"><label>Your Name</label><input id="su-name" placeholder="Jane Smith" /></div>
    <div class="field"><label>Your Email</label><input id="su-email" type="email" placeholder="jane@county.gov" /></div>
    <div class="field"><label>Password</label><input id="su-password" type="password" placeholder="At least 8 characters" /></div>
    <button class="btn btn-primary" style="width:100%" onclick="doSignup()">Create Organization</button>
    <div id="su-msg"></div>
  </div>
</div>

<script>
function showTab(t){
  document.getElementById('tabLogin').classList.toggle('active', t==='login');
  document.getElementById('tabSignup').classList.toggle('active', t==='signup');
  document.getElementById('panelLogin').classList.toggle('active', t==='login');
  document.getElementById('panelSignup').classList.toggle('active', t==='signup');
}
async function doLogin(){
  const email = document.getElementById('li-email').value.trim();
  const password = document.getElementById('li-password').value;
  const msg = document.getElementById('li-msg');
  msg.className=''; msg.textContent='';
  try{
    const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email,password}) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Login failed');
    window.location.href = 'console.html';
  }catch(err){ msg.className='err'; msg.textContent = err.message; }
}
async function doSignup(){
  const orgName = document.getElementById('su-org').value.trim();
  const adminName = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim();
  const password = document.getElementById('su-password').value;
  const msg = document.getElementById('su-msg');
  msg.className=''; msg.textContent='';
  try{
    const res = await fetch('/api/auth/signup-organization', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({orgName,adminName,email,password}) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Could not create organization');
    window.location.href = 'console.html';
  }catch(err){ msg.className='err'; msg.textContent = err.message; }
}
</script>
</body>
</html>
