<svg viewBox="0 0 340 100" xmlns="http://www.w3.org/2000/svg">
  <!-- RentPayEZ full logo (icon + wordmark). Transparent background — no
       backing rect anywhere in this file, so it drops cleanly onto the
       dark navy interface (or any other background) with no white box.
       Uses Arial/Helvetica rather than the app's web font (Plus Jakarta
       Sans) because standalone .svg files loaded via <img src="..."> can't
       fetch external @font-face resources — this keeps the wordmark
       readable everywhere the file is used on its own (business cards,
       presentations, print), not just inside the app's own pages. -->
  <defs>
    <linearGradient id="lf-roof" x1="20" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c93e3e"/>
      <stop offset="1" stop-color="#7a1f1f"/>
    </linearGradient>
    <linearGradient id="lf-smoke" x1="25" y1="4" x2="42" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5bc05b"/>
      <stop offset="1" stop-color="#2d7d2d"/>
    </linearGradient>
  </defs>
  <!-- smoke -->
  <path d="M22 30 C14 26 30 20 22 15 C15 11 28 6 22 3" stroke="url(#lf-smoke)" stroke-width="4.2" fill="none" stroke-linecap="round"/>
  <path d="M34 26 C28 23 38 18 32 15" stroke="url(#lf-smoke)" stroke-width="3.4" fill="none" stroke-linecap="round" opacity="0.85"/>
  <!-- chimney -->
  <rect x="24" y="10" width="15" height="27" fill="url(#lf-roof)"/>
  <!-- house / roof pentagon -->
  <path d="M50 16 L86 47 L86 81 Q86 86 81 86 L19 86 Q14 86 14 81 L14 47 Z" fill="url(#lf-roof)"/>
  <!-- white plaque -->
  <rect x="29" y="49" width="34" height="30" rx="6" fill="#f4f4f2"/>
  <!-- R -->
  <text x="46" y="73" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="30" fill="#111111" text-anchor="middle">R</text>
  <!-- wordmark: "ent" + "pay" + "ez" (the R above completes "Rent") -->
  <text x="100" y="66" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="38" letter-spacing="-0.5">
    <tspan fill="#ffffff">ent</tspan><tspan fill="#c93e3e">pay</tspan><tspan fill="#5bc05b">ez</tspan>
  </text>
</svg>
