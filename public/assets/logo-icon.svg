<svg viewBox="-7 -10 106 106" xmlns="http://www.w3.org/2000/svg">
  <!-- RentPayEZ brand icon: a house roofline that becomes the R, with a
       chimney (smoke) rising from the roof and a small window centered in
       the open loop of the R. Chimney and window are drawn after the
       roofline stroke in document order so they sit cleanly on top of it
       with no crossing/notched edges. -->
  <defs>
    <linearGradient id="r1" x1="10" y1="5" x2="95" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8453a"/>
      <stop offset="0.42" stop-color="#a81f18"/>
      <stop offset="1" stop-color="#2a0503"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="18" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f9530"/>
      <stop offset="1" stop-color="#2c5719"/>
    </linearGradient>
  </defs>
  <!-- smoke -->
  <path d="M18,26 C17.3,22 18.7,19 18,16 C12,12 24,9 18,5 C12,2 22,0 18,-3" stroke="url(#g1)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M22,26 C21.3,22 22.7,19 22,16 C16,12 28,9 22,5 C16,2 26,0 22,-3" stroke="url(#g1)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- roofline + bowl -->
  <path d="M8,60 L43,29 Q49,24 55,29 L82,53 Q86,57 82,61
           Q72,71 59,66 Q50,62 49,53"
        fill="none" stroke="url(#r1)" stroke-width="9.5" stroke-linecap="butt" stroke-linejoin="round"/>
  <circle cx="8" cy="60" r="4.7" fill="url(#r1)"/>
  <!-- chimney (drawn after roofline so it sits cleanly on top) -->
  <path d="M10,44 L10,23 L16,19 L24,19 L24,44 Z" fill="url(#r1)"/>
  <!-- stem -->
  <rect x="31" y="45" width="14" height="42" rx="2" fill="url(#r1)"/>
  <!-- diagonal leg -->
  <path d="M44,60 L86,85 L79,90 L38,66 Z" fill="url(#r1)"/>
  <!-- window, centered in the open loop -->
  <g fill="url(#g1)">
    <rect x="50.9" y="42.4" width="4.2" height="4.2" rx="0.8"/>
    <rect x="55.9" y="42.4" width="4.2" height="4.2" rx="0.8"/>
    <rect x="50.9" y="47.4" width="4.2" height="4.2" rx="0.8"/>
    <rect x="55.9" y="47.4" width="4.2" height="4.2" rx="0.8"/>
  </g>
</svg>
