<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>rentpayez — Resident Portal</title>
<link rel="icon" type="image/png" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
// iOS Safari's "Request Desktop Website" mode fakes window.innerWidth to a
// desktop-class value (~980px+) AND spoofs navigator.userAgent to look like
// Mac Safari, so neither the CSS @media(max-width:880px) rules below nor
// user-agent sniffing can detect "this is actually a phone" in that mode.
// window.screen.width, however, stays tied to the real physical screen
// even when the layout viewport is faked — so a small screen.width paired
// with a large window.innerWidth is a reliable signal that a phone is
// rendering the page as if it were a desktop. When that mismatch is
// detected we add .force-mobile to <html>, and every mobile layout rule
// below has a matching html.force-mobile selector (higher specificity
// than the unscoped desktop rules) so the compact layout applies
// regardless of what the browser claims its viewport width is.
(function () {
  function applyForceMobile() {
    try {
      var screenW = window.screen && window.screen.width ? window.screen.width : 0;
      var innerW = window.innerWidth || 0;
      var mismatch = screenW > 0 && screenW <= 500 && innerW > 880;
      document.documentElement.classList.toggle('force-mobile', mismatch);
    } catch (e) { /* ignore */ }
  }
  applyForceMobile();
  window.addEventListener('resize', applyForceMobile);
  window.addEventListener('orientationchange', applyForceMobile);
})();
</script>
<style>
:root{
  --brick:#8b2424; --brick-2:#a32d2d; --brick-3:#c93e3e;
  --green:#2d7d2d; --green-2:#3a9c3a; --green-3:#5bc05b;
  --gold:#d4a247; --gold-2:#e8c074;
  --navy-0:#06101c; --navy-1:#0b1a2a; --navy-2:#102540; --navy-3:#16334f;
  --ink:#e9eef5; --ink-2:#b8c4d4; --ink-3:#7c8a9d;
  --line:rgba(255,255,255,0.08); --line-2:rgba(255,255,255,0.14);
  --card:rgba(255,255,255,0.04); --card-2:rgba(255,255,255,0.06);
  --good:#3a9c3a; --bad:#a32d2d; --warn:#d4a247; --pending:#3e8ab4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100vh}
body{
  background:
    radial-gradient(1200px 800px at 12% -10%, rgba(139,36,36,0.14), transparent 60%),
    radial-gradient(1200px 800px at 95% 5%, rgba(45,125,45,0.10), transparent 60%),
    linear-gradient(180deg, #07121f 0%, #0a1a2c 35%, #07121f 100%);
  color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;min-height:100vh
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}

/* sidebar */
.sidebar{width:250px;background:linear-gradient(180deg,#08131f,#06101a);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:20}
.sb-brand{display:flex;align-items:center;gap:11px;padding:6px 6px 20px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,#1a3552,#0b1a2a);display:flex;align-items:center;justify-content:center;border:1px solid var(--line-2);flex-shrink:0}
.brand-word{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:800;letter-spacing:-0.4px}
.brand-word .b1{color:#fff}
.brand-word .b2{color:#0b0b0b;background:#fff;border-radius:5px;padding:0 4px;margin-right:1px}
.brand-word .b3{color:var(--brick-3)}
.brand-word .b4{color:var(--green-3)}
.sb-nav{display:flex;flex-direction:column;gap:3px;margin-top:14px;flex:1}
.sb-nav button{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;color:var(--ink-2);font-size:13.5px;font-weight:500;text-align:left;width:100%;transition:all .15s}
.sb-nav button:hover{background:rgba(255,255,255,0.04);color:#fff}
.sb-nav button.active{background:linear-gradient(180deg, rgba(139,36,36,0.2), rgba(139,36,36,0.08));color:#fff;border:1px solid rgba(139,36,36,0.28)}
.sb-nav button .ic{width:20px;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.sb-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
.sb-user{display:flex;align-items:center;gap:9px;padding:8px}
.sb-user-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#a32d2d,#5c1818);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:12px;flex-shrink:0}
.sb-user-info{flex:1;min-width:0}
.sb-user-info .n{color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user-info .r{color:var(--ink-3);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-logout{margin-top:6px;width:100%;padding:9px;border-radius:9px;background:rgba(255,255,255,0.03);border:1px solid var(--line);color:var(--ink-2);font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.sb-logout:hover{background:rgba(255,255,255,0.06);color:#fff}
.lang-toggle{display:flex;border-radius:9px;overflow:hidden;border:1px solid var(--line-2);margin-top:2px}
.lang-toggle button{flex:1;padding:7px 0;font-size:11.5px;font-weight:700;color:var(--ink-3);background:rgba(255,255,255,0.02)}
.lang-toggle button.active{background:linear-gradient(180deg,var(--green-2),var(--green));color:#fff}
.lang-toggle button:not(.active):hover{background:rgba(255,255,255,0.06);color:#fff}

@media (max-width:880px){
  body{flex-direction:column}
  /* .sidebar's desktop rule sets overflow-y:auto to make the fixed
     100vh column independently scrollable — with height:auto that
     property has no scroll container to apply to, but leaving it
     declared alongside a still-flex:1 .sb-nav (see below) compounds
     the stretching bug, so it's explicitly cleared too. */
  .sidebar{position:relative;width:100%;height:auto;overflow-y:visible;border-right:none;border-bottom:1px solid var(--line);padding:12px}
  /* Desktop's .sb-nav rule sets flex:1 so the nav list fills whatever
     vertical space is left in the 100vh sidebar column above .sb-foot.
     Without resetting it here, .sb-nav keeps trying to grow to fill
     leftover vertical space even in this horizontal pill-row layout,
     which (combined with flex-wrap:wrap's multi-line stretch behavior)
     pushes the wrapped rows apart with a large gap between them instead
     of sitting compactly one below the other. flex:none stops it from
     growing past its actual content height. */
  .sb-nav{flex:none;flex-direction:row;flex-wrap:wrap;overflow-x:auto;margin-top:8px}
  /* Desktop's .sb-nav button rule sets width:100% so each item fills the
     vertical sidebar column — without resetting it here, every nav button
     still claims the full row width even in this horizontal pill-row
     layout, so flex-wrap has nothing to wrap (each button is already
     "100%") and every item stacks on its own line instead of forming a
     compact row of pills. width:auto lets buttons size to their content. */
  .sb-nav button{flex-shrink:0;padding:7px 10px;font-size:12px;width:auto}
  .sb-brand{padding-bottom:10px;margin-bottom:2px}
  .sb-foot{display:none}
}
/* Mirror of the @media(max-width:880px) block above, scoped to the
   .force-mobile class set by the head script when it detects a phone
   spoofing a desktop viewport (see comment there). Class selectors beat
   the unscoped desktop rules on specificity, so these apply even though
   the real @media query never matches in that scenario. */
html.force-mobile body{flex-direction:column}
html.force-mobile .sidebar{position:relative;width:100%;height:auto;overflow-y:visible;border-right:none;border-bottom:1px solid var(--line);padding:12px}
html.force-mobile .sb-nav{flex:none;flex-direction:row;flex-wrap:wrap;overflow-x:auto;margin-top:8px}
html.force-mobile .sb-nav button{flex-shrink:0;padding:7px 10px;font-size:12px;width:auto}
html.force-mobile .sb-brand{padding-bottom:10px;margin-bottom:2px}
html.force-mobile .sb-foot{display:none}

/* main */
.app-main{flex:1;min-width:0;padding:26px 30px 60px;max-width:100%}
@media (max-width:880px){.app-main{padding:18px}}
html.force-mobile .app-main{padding:18px}
.app-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:16px;flex-wrap:wrap}
.app-head h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:25px;font-weight:800;letter-spacing:-0.5px;color:#fff;margin:0}
.app-head .sub{color:var(--ink-3);font-size:13.5px;margin-top:3px}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
@media (max-width:1050px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.kpi-grid{grid-template-columns:1fr}}
html.force-mobile .kpi-grid{grid-template-columns:1fr}
.kpi{background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.015));border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.kpi .label{color:var(--ink-3);font-size:11px;letter-spacing:0.7px;text-transform:uppercase;font-weight:700}
.kpi .val{font-family:'Plus Jakarta Sans',sans-serif;font-size:26px;font-weight:800;letter-spacing:-0.6px;color:#fff;margin:6px 0 3px;line-height:1}
.kpi .trend{color:var(--green-3);font-size:11.5px;font-weight:600}
.kpi .ic{position:absolute;top:13px;right:15px;width:32px;height:32px;border-radius:9px;background:rgba(139,36,36,0.15);color:var(--brick-3);display:flex;align-items:center;justify-content:center;font-size:15px}
.kpi.green .ic{background:rgba(45,125,45,0.15);color:var(--green-3)}
.kpi.gold .ic{background:rgba(212,162,71,0.15);color:var(--gold-2)}
.kpi.blue .ic{background:rgba(62,138,180,0.15);color:#76b8e0}

.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:1050px){.dash-grid{grid-template-columns:1fr}}
html.force-mobile .dash-grid{grid-template-columns:1fr}
.panel{background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.015));border:1px solid var(--line);border-radius:18px;padding:20px}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.panel-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:700;color:#fff;margin:0}
.panel-sub{color:var(--ink-3);font-size:12px;margin-top:2px}

.table{width:100%;border-collapse:collapse}
.table th{text-align:left;color:var(--ink-3);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;padding:9px 12px;border-bottom:1px solid var(--line)}
.table td{padding:12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink)}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:rgba(255,255,255,0.02)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px}
.pill.paid,.pill.resolved,.pill.reported,.pill.done,.pill.signed{background:rgba(45,125,45,0.18);color:var(--green-3);border:1px solid rgba(45,125,45,0.28)}
.pill.pending,.pill.pending_signature,.pill.open,.pill.active{background:rgba(62,138,180,0.18);color:#76b8e0;border:1px solid rgba(62,138,180,0.28)}
.pill.processing,.pill.in_progress{background:rgba(212,162,71,0.18);color:var(--gold-2);border:1px solid rgba(212,162,71,0.28)}
.pill.failed,.pill.overdue,.pill.emergency{background:rgba(139,36,36,0.18);color:#e76d6d;border:1px solid rgba(139,36,36,0.28)}
.pill.closed{background:rgba(255,255,255,0.06);color:var(--ink-2);border:1px solid var(--line-2)}
.pill.preview{background:rgba(212,162,71,0.22);color:var(--gold-2);border:1px solid rgba(212,162,71,0.4);letter-spacing:0.8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:11px;font-weight:600;font-size:13.5px;transition:all .15s;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:linear-gradient(180deg, var(--brick-2), var(--brick));color:#fff;box-shadow:0 6px 18px rgba(139,36,36,0.38)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-secondary{background:rgba(255,255,255,0.04);border:1px solid var(--line-2);color:#fff}
.btn-secondary:hover{background:rgba(255,255,255,0.08)}
.btn-green{background:linear-gradient(180deg, var(--green-2), var(--green));color:#fff;box-shadow:0 6px 18px rgba(45,125,45,0.32)}
.btn-lg{padding:13px 20px;font-size:14.5px;border-radius:13px}
.btn-block{width:100%}
.btn-sm{padding:7px 11px;font-size:12px;border-radius:9px}

.field{margin-bottom:14px}
.field label{display:block;color:var(--ink-3);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:rgba(0,0,0,0.22);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;color:#fff;font-size:13.5px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brick-3)}
.field input:disabled{color:var(--ink-2);opacity:0.75}

.msg{margin-top:10px;font-size:13px}
.msg.ok{color:var(--green-3)}
.msg.err{color:#e76d6d}

/* score preview card */
.score-hero{background:
  radial-gradient(400px 200px at 100% 0%, rgba(91,192,91,0.18), transparent 60%),
  radial-gradient(300px 200px at 0% 100%, rgba(212,162,71,0.1), transparent 60%),
  linear-gradient(160deg,#0f2922,#0a1726 60%);
  border:1px solid rgba(91,192,91,0.22);position:relative
}
.preview-ribbon{position:absolute;top:14px;right:-32px;background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1a1200;font-size:10.5px;font-weight:800;letter-spacing:1px;padding:5px 40px;transform:rotate(35deg);box-shadow:0 4px 10px rgba(0,0,0,0.3)}

/* streak */
.streak{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.streak div{flex:1;min-width:22px;height:34px;border-radius:8px;background:rgba(45,125,45,0.18);border:1px solid rgba(45,125,45,0.3);color:var(--green-3);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700}
.streak div.miss{background:rgba(139,36,36,0.18);border-color:rgba(139,36,36,0.3);color:#e76d6d}

/* coach */
.coach-panel{background:linear-gradient(160deg,#0e1f33,#0a1726);border:1px solid var(--line-2);border-radius:18px;padding:0;overflow:hidden}
.coach-head-bar{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;background:rgba(45,125,45,0.04)}
.chat-avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#3a9c3a,#1e5b1e);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.coach-feed{height:360px;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.coach-foot{padding:14px 20px;border-top:1px solid var(--line)}
.bubble{padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.5;max-width:88%;margin-bottom:6px;white-space:pre-wrap}
.bubble.user{background:linear-gradient(180deg,var(--brick-2),var(--brick));color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.bubble.ai{background:rgba(255,255,255,0.05);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:5px}
.bubble.sys{background:rgba(212,162,71,0.08);border:1px solid rgba(212,162,71,0.22);color:var(--ink-2);font-size:12.5px;text-align:center;max-width:100%;margin:0 auto 6px}
.chat-input{display:flex;gap:8px;background:rgba(0,0,0,0.25);border:1px solid var(--line);border-radius:13px;padding:5px 5px 5px 12px;align-items:center}
.chat-input input{flex:1;background:transparent;border:none;color:#fff;font-size:13.5px;outline:none;padding:8px 0}
.chat-input button{width:36px;height:36px;border-radius:9px;background:linear-gradient(180deg,var(--green-2),var(--green));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.chat-input button:disabled{opacity:0.5}

/* goals */
.goal-card{padding:14px;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:13px;margin-bottom:10px}
.goal-card.done{background:rgba(45,125,45,0.08);border-color:rgba(45,125,45,0.22)}
.goal-bar{height:8px;border-radius:99px;background:rgba(255,255,255,0.08);overflow:hidden;margin:8px 0}
.goal-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green-2));border-radius:99px}

/* maintenance photo */
.thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;border:1px solid var(--line-2);cursor:pointer}
.upload-box{border:1.5px dashed var(--line-2);border-radius:12px;padding:14px;text-align:center;color:var(--ink-3);font-size:12.5px;cursor:pointer}
.upload-box:hover{border-color:var(--brick-3);color:var(--ink-2)}
.upload-preview{margin-top:10px;display:flex;align-items:center;gap:10px}
.upload-preview img{width:60px;height:60px;border-radius:10px;object-fit:cover;border:1px solid var(--line-2)}

.empty{color:var(--ink-3);text-align:center;padding:22px;font-size:13px}
.loading-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--ink-3);width:100%}
</style>
</head>
<body>

<div id="loadingScreen" class="loading-screen">Loading your account…</div>

<div id="appShell" style="display:none;width:100%">
  <aside class="sidebar">
    <div class="sb-brand">
      <span class="brand-mark">
        <svg viewBox="0 0 100 100" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="pf-roof" x1="20" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c93e3e"/><stop offset="1" stop-color="#7a1f1f"/></linearGradient>
            <linearGradient id="pf-smoke" x1="25" y1="4" x2="42" y2="34" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5bc05b"/><stop offset="1" stop-color="#2d7d2d"/></linearGradient>
          </defs>
          <path d="M22 30 C14 26 30 20 22 15 C15 11 28 6 22 3" stroke="url(#pf-smoke)" stroke-width="4.2" fill="none" stroke-linecap="round"/>
          <path d="M34 26 C28 23 38 18 32 15" stroke="url(#pf-smoke)" stroke-width="3.4" fill="none" stroke-linecap="round" opacity="0.85"/>
          <rect x="24" y="10" width="15" height="27" fill="url(#pf-roof)"/>
          <path d="M50 16 L86 47 L86 81 Q86 86 81 86 L19 86 Q14 86 14 81 L14 47 Z" fill="url(#pf-roof)"/>
          <rect x="29" y="49" width="34" height="30" rx="6" fill="#f4f4f2"/>
          <text x="46" y="73" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="30" fill="#111111" text-anchor="middle">R</text>
        </svg>
      </span>
      <span class="brand-word"><span class="b1">ent</span><span class="b3">pay</span><span class="b4">ez</span></span>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-foot">
      <div class="sb-user" id="sbUser"></div>
      <div class="lang-toggle" id="langToggle">
        <button id="langBtnEn" onclick="setLang('en')">EN</button>
        <button id="langBtnEs" onclick="setLang('es')">ES</button>
      </div>
      <button class="sb-logout" onclick="logout()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span id="signOutLabel">Sign out</span>
      </button>
    </div>
  </aside>
  <main class="app-main" id="appMain"></main>
</div>

<script>
/* ═══════════════════════════ i18n (English / Español) ═══════════════════════════ */
const I18N = {
  en: {
    nav_dash:'Dashboard', nav_pay:'Pay Rent', nav_history:'Payment History', nav_maintenance:'Maintenance',
    nav_inspections:'Inspections', nav_documents:'Documents', nav_coach:'AI Coach', nav_goals:'My Goals', nav_settings:'Settings',
    sign_out:'Sign out', resident:'Resident', unit_n:'Unit {{n}}',
    loading_account:'Loading your account…', loading:'Loading…',
    welcome_back:'Welcome back, {{name}} 👋', your_resident_portal:'Your resident portal',
    credit_score:'Credit Score', preview:'Preview', not_connected_yet:'Not connected yet',
    payment_streak:'Payment Streak', mo_n:'{{n}} mo', based_on_real_payments:'Based on your real payments',
    total_paid_on_record:'Total Paid on Record', payment_n:'{{n}} payment', payments_n:'{{n}} payments',

function t(key, vars){
  let s = (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;
  if(vars) Object.keys(vars).forEach(k => { s = s.split('{{'+k+'}}').join(vars[k]); });
  return s;
}
function statusLabel(s){ return t('status_' + String(s||'').toLowerCase()) !== 'status_' + String(s||'').toLowerCase() ? t('status_' + String(s||'').toLowerCase()) : String(s||'').replace('_',' '); }
function setLang(lang){
  LANG = lang;

  renderSidebar();
  setView(VIEW);
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function money(cents){ return '$' + (cents/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){ return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }

async function boot(){
  document.getElementById('loadingScreen').textContent = t('loading_account');
  try{
    const meRes = await fetch('/api/tenant-auth/me');
    if(!meRes.ok){ window.location.href = 'login.html'; return; }
    ME = (await meRes.json()).tenant;

    const res = await fetch('/api/tenant/me');
    if(!res.ok) throw new Error(t('could_not_load_account'));
    T = await res.json();

    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('appShell').style.display = 'flex';

    renderSidebar();
    await handleStripeReturn();
    setView('dash');
  }catch(err){
    document.getElementById('loadingScreen').textContent = err.message;
  }
}

function renderSidebar(){
  document.getElementById('sbNav').innerHTML = NAV.map(n =>
    `<button class="${n.id===VIEW?'active':''}" onclick="setView('${n.id}')"><span class="ic">${n.ic}</span><span>${esc(t(n.key))}</span></button>`
  ).join('');
  const initials = (T.name||'?').split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
  const av = T.has_avatar
    ? `<img src="/api/tenant/me/avatar?v=${AVATAR_V}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/>`
    : esc(initials);
  document.getElementById('sbUser').innerHTML = `
    <div class="sb-user-av">${av}</div>
    <div class="sb-user-info"><div class="n">${esc(T.name)}</div><div class="r">${esc(T.unit_number ? t('unit_n',{n:T.unit_number}) : t('resident'))}</div></div>
  `;
  document.getElementById('langBtnEn').classList.toggle('active', LANG==='en');
  document.getElementById('langBtnEs').classList.toggle('active', LANG==='es');
  document.getElementById('signOutLabel').textContent = t('sign_out');
}

async function setView(id){
  VIEW = id;
  renderSidebar();
  const m = document.getElementById('appMain');
  m.innerHTML = `<div class="empty">${t('loading')}</div>`;
  const renderers = { dash: renderDash, pay: renderPay, history: renderHistory, maintenance: renderMaintenance, inspections: renderInspections, documents: renderDocuments, coach: renderCoach, goals: renderGoals, settings: renderSettings };
  await renderers[id]();
  m.scrollTo?.({top:0});
}

/* ═══════════════════════════ RENT REMINDER (in-app only) ═══════════════════════════ */
// No email/SMS is sent — this reads T.rent_reminder, computed server-side
// by the same logic staff see in their Rent Reminders tab (see
// services/reminders.js), from the unit's rent_due_day and whether a
// payment already exists for the current calendar month.
function reminderBannerHtml(){
  const r = T.rent_reminder;
  if(!r || r.status === 'no_due_day' || r.status === 'paid' || r.status === 'upcoming') return '';
  const overdue = r.status === 'overdue';
  const due = r.dueDay + ordinal(r.dueDay);
  const text = overdue
    ? t('rent_overdue', {days: Math.abs(r.daysUntilDue), s: Math.abs(r.daysUntilDue)===1?'':'s', due})
    : r.daysUntilDue === 0
      ? t('rent_due_today', {due})
      : t('rent_due_in', {days: r.daysUntilDue, s: r.daysUntilDue===1?'':'s', due});
  return `
    <div style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:13px;margin-bottom:18px;
      background:${overdue?'rgba(139,36,36,0.12)':'rgba(212,162,71,0.1)'};
      border:1px solid ${overdue?'rgba(139,36,36,0.3)':'rgba(212,162,71,0.28)'}">
      <div style="font-size:18px">${overdue?'⚠️':'⏰'}</div>
      <div style="flex:1;color:var(--ink);font-size:13.5px">${text}</div>
      <button class="btn btn-sm ${overdue?'btn-primary':'btn-secondary'}" onclick="setView('pay')">${esc(t('pay_now'))}</button>
    </div>
  `;
}
function ordinal(n){ if(!n) return ''; const s=['th','st','nd','rd'], v=n%100; return s[(v-20)%10]||s[v]||s[0]; }

function computeStreak(payments){
  if(!payments.length) return 0;
  const months = new Set(payments.map(p => new Date(p.paid_at).toISOString().slice(0,7)));
  let streak = 0;
  let cursor = new Date();
  for(let i=0;i<60;i++){
    const key = cursor.toISOString().slice(0,7);
    if(months.has(key)){ streak++; cursor.setMonth(cursor.getMonth()-1); }
    else if(i===0){ cursor.setMonth(cursor.getMonth()-1); } // allow current month to still be open
    else break;
  }
  return streak;
}

function streakStripHtml(payments){
  const months = new Set(payments.map(p => new Date(p.paid_at).toISOString().slice(0,7)));
  const cells = [];
  const cursor = new Date();
  cursor.setDate(1);
  cursor.setMonth(cursor.getMonth()-11);
  for(let i=0;i<12;i++){
    const key = cursor.toISOString().slice(0,7);
    const label = cursor.toLocaleDateString(undefined,{month:'narrow'});
    cells.push(`<div class="${months.has(key)?'':'miss'}">${esc(label)}</div>`);
    cursor.setMonth(cursor.getMonth()+1);
  }
  return `<div class="streak">${cells.join('')}</div><div style="color:var(--ink-3);font-size:11.5px;margin-top:10px">${esc(t('streak_legend'))}</div>`;
}

      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div><div style="color:#fff;font-weight:600;font-size:14px">${esc(g.title)}</div>${g.target_note?`<div style="color:var(--ink-3);font-size:12px;margin-top:2px">${esc(g.target_note)}</div>`:''}</div>
        <span class="pill ${g.status==='done'?'done':'in_progress'}">${g.status==='done'?esc(t('done')):g.progress_pct+'%'}</span>
      </div>
      <div class="goal-bar"><i style="width:${g.progress_pct}%"></i></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        ${g.status!=='done' ? `
          <button class="btn btn-sm btn-secondary" onclick="bumpGoal('${g.id}', ${Math.min(100,g.progress_pct+10)})">+10%</button>
          <button class="btn btn-sm btn-secondary" onclick="completeGoal('${g.id}')">${esc(t('mark_done'))}</button>
        ` : ''}
        <button class="btn btn-sm btn-secondary" onclick="deleteGoal('${g.id}')">${esc(t('delete'))}</button>
      </div>
    </div>
  `).join('');
}
async function addGoal(){
  const title = document.getElementById('goal-title').value.trim();
  const targetNote = document.getElementById('goal-note').value.trim();
  const msg = document.getElementById('goal-msg');
  try{
    if(!title) throw new Error(t('give_goal_title'));
    const res = await fetch('/api/tenant/goals', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({title, targetNote}) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || t('could_not_add_goal'));
    await renderGoals();
  }catch(err){ msg.className='msg err'; msg.textContent = err.message; }
}
async function bumpGoal(id, pct){
  await fetch(`/api/tenant/goals/${id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({progressPct: pct}) });
  await renderGoals();
}
async function completeGoal(id){
  await fetch(`/api/tenant/goals/${id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({progressPct: 100, status: 'done'}) });
  await renderGoals();
}
async function deleteGoal(id){
  if(!confirm(t('delete_goal_confirm'))) return;
  await fetch(`/api/tenant/goals/${id}`, { method:'DELETE' });
  await renderGoals();
}

/* ═══════════════════════════ SETTINGS ═══════════════════════════ */
async function renderSettings(){
  document.getElementById('appMain').innerHTML = `
    <div class="app-head"><div><h1>${esc(t('settings_title'))}</h1><div class="sub">${esc(t('settings_sub'))}</div></div></div>
    <div class="dash-grid">
      <div class="panel">
        <h3 class="panel-title" style="margin-bottom:14px">${esc(t('profile_photo'))}</h3>
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px">
          <div id="avatar-preview" style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#a32d2d,#5c1818);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:20px;flex-shrink:0;overflow:hidden">
            ${T.has_avatar ? `<img src="/api/tenant/me/avatar?v=${AVATAR_V}" alt="" style="width:100%;height:100%;object-fit:cover"/>` : esc((T.name||'?').split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase())}
          </div>
          <div style="flex:1">
            <input type="file" id="avatar-file" accept="image/*" onchange="onAvatarSelected(event)" style="font-size:12.5px"/>
            <div style="margin-top:8px;display:flex;gap:8px">
              <button class="btn btn-primary btn-sm" onclick="saveAvatar()">${esc(t('upload_photo'))}</button>
              ${T.has_avatar ? `<button class="btn btn-secondary btn-sm" onclick="removeAvatar()">${esc(t('remove_photo'))}</button>` : ''}
            </div>
          </div>
        </div>
        <div id="avatar-msg" class="msg"></div>
      </div>
      <div class="panel">
        <h3 class="panel-title" style="margin-bottom:14px">${esc(t('your_home'))}</h3>
        <div class="field"><label>${esc(t('property'))}</label><input disabled value="${esc(T.property_name || t('not_yet_assigned'))}"/></div>
        <div class="field"><label>${esc(t('address'))}</label><input disabled value="${esc(T.property_address || '—')}"/></div>
        <div class="field"><label>${esc(t('unit'))}</label><input disabled value="${esc(T.unit_number || '—')}"/></div>
        <div class="field"><label>${esc(t('monthly_rent'))}</label><input disabled value="${T.monthly_rent ? '$'+Number(T.monthly_rent).toLocaleString() : '—'}"/></div>
        ${(T.emergency_contact_name || T.emergency_contact_phone) ? `
          <div class="field"><label>${esc(t('emergency_contact'))}</label><input disabled value="${esc(T.emergency_contact_name||'')}${T.emergency_contact_phone?' · '+esc(T.emergency_contact_phone):''}"/></div>
        ` : ''}
      </div>
      <div class="panel">
        <h3 class="panel-title" style="margin-bottom:14px">${esc(t('your_contact_info'))}</h3>
        <div class="field"><label>${esc(t('name'))}</label><input disabled value="${esc(T.name)}"/></div>
        <div class="field"><label>${esc(t('email'))}</label><input disabled value="${esc(T.email)}"/></div>
        <div class="field"><label>${esc(t('phone'))}</label><input id="f-phone" value="${esc(T.phone||'')}" placeholder="${esc(t('phone_ph'))}"/></div>
        <button class="btn btn-primary" onclick="saveProfile()">${esc(t('save_phone'))}</button>
        <div id="profile-msg" class="msg"></div>
      </div>
    </div>
  `;
}
function onAvatarSelected(e){
  const file = e.target.files[0];
  if(!file) return;
  if(file.size > 2.2*1024*1024){
    document.getElementById('avatar-msg').className = 'msg err';
    document.getElementById('avatar-msg').textContent = t('photo_too_large_av');
    e.target.value = ''; return;
  }
  const reader = new FileReader();
  reader.onload = () => { PENDING_AVATAR = { base64: reader.result.split(',')[1], mime: file.type }; };
  reader.readAsDataURL(file);
}
async function saveAvatar(){
  const msg = document.getElementById('avatar-msg');
  if(!PENDING_AVATAR){ msg.className = 'msg err'; msg.textContent = t('choose_photo_first'); return; }
  try{
    const res = await fetch('/api/tenant/me/avatar', { method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ avatarBase64: PENDING_AVATAR.base64, avatarMime: PENDING_AVATAR.mime }) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || t('could_not_save_photo'));
    T.has_avatar = true; PENDING_AVATAR = null; AVATAR_V++;
    msg.className = 'msg ok'; msg.textContent = t('photo_updated');
    renderSidebar(); renderSettings();
  }catch(err){ msg.className = 'msg err'; msg.textContent = err.message; }
}
async function removeAvatar(){
  const msg = document.getElementById('avatar-msg');
  try{
    const res = await fetch('/api/tenant/me/avatar', { method:'DELETE' });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || t('could_not_remove_photo'));
    T.has_avatar = false; AVATAR_V++;
    renderSidebar(); renderSettings();
  }catch(err){ msg.className = 'msg err'; msg.textContent = err.message; }
}
async function saveProfile(){
  const phone = document.getElementById('f-phone').value.trim();
  const msg = document.getElementById('profile-msg');
  try{
    const res = await fetch('/api/tenant/me', { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({phone}) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || t('could_not_save'));
    T.phone = phone;
    msg.className = 'msg ok'; msg.textContent = t('saved');
  }catch(err){ msg.className = 'msg err'; msg.textContent = err.message; }
}

async function logout(){
  await fetch('/api/tenant-auth/logout', { method:'POST' });
  window.location.href = 'login.html';
}

boot();
</script>
