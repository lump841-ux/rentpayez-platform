<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RentPayEZ — Resident Portal</title>
<link rel="icon" type="image/png" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:wght@900&display=swap" rel="stylesheet">
<script>
// iOS Safari's "Request Desktop Website" mode fakes window.innerWidth to a
// desktop-class value (~980px+) AND spoofs navigator.userAgent to look like
// Mac Safari, so neither the CSS @media(max-width:768px) rules below nor
// user-agent sniffing can detect "this is actually a phone" in that mode.
// window.screen.width, however, stays tied to the real physical screen
// even when the layout viewport is faked — so a small screen.width paired
// with a large window.innerWidth is a reliable signal that a phone is
// rendering the page as if it were a desktop. When that mismatch is
// detected we add .force-mobile to <html>, and mobile layout rules below
// have a matching html.force-mobile selector (higher specificity than the
// unscoped desktop rules) so the compact layout applies regardless of what
// the browser claims its viewport width is.
(function () {
  function applyForceMobile() {
    try {
      var screenW = window.screen && window.screen.width ? window.screen.width : 0;
      var innerW = window.innerWidth || 0;
      var mismatch = screenW > 0 && screenW <= 500 && innerW > 768;
      document.documentElement.classList.toggle('force-mobile', mismatch);
    } catch (e) { /* ignore */ }
  }
  applyForceMobile();
  window.addEventListener('resize', applyForceMobile);
  window.addEventListener('orientationchange', applyForceMobile);
})();
</script>
<style>
:root{
  --red:#c93326; --red-dk:#a32d2d; --red-lt:#fbeceb;
  --green:#2d7d2d; --green-2:#3a9c3a; --green-lt:#e9f6e9;
  --gold:#b9822c; --gold-2:#d4a247; --gold-lt:#faf1e0;
  --blue:#2f7aa8; --blue-lt:#e8f3f9;
  --navy:#0f1626;
  --ink:#14161c; --ink-2:#5c6270; --ink-3:#9096a3;
  --line:#e8e9f0; --line-2:#d9dbe6;
  --bg:#f5f6fa; --card:#ffffff;
  --sh-sm:0 1px 2px rgba(20,22,28,.04), 0 1px 1px rgba(20,22,28,.03);
  --sh-md:0 8px 24px rgba(20,22,28,.06), 0 2px 6px rgba(20,22,28,.04);
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px; --r-full:999px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100vh;width:100%;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg);
  color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}

/* ── Top nav ─────────────────────────────────────────────────────── */
.topnav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid var(--line)}
.topnav-inner{max-width:1180px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:2px;flex-shrink:0}
.brand-word{font-family:'DM Sans','Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:900;letter-spacing:-.06em}
.brand-word .b1{color:#000}
.brand-word .b3{color:#dc2626}
.brand-word .b4{color:#22c55e}
.topnav-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
.prop-toggle{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-full);padding:3px;gap:2px;flex-shrink:0}
.prop-toggle span{padding:6px 14px;border-radius:var(--r-full);font-size:12.5px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.prop-toggle span.active{background:#fff;color:var(--red);box-shadow:var(--sh-sm)}
.unit-badge{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.unit-badge .u{font-size:12.5px;font-weight:700;color:var(--ink)}
.unit-badge .a{font-size:11px;color:var(--ink-3)}
.user-menu{position:relative}
.user-avatar-btn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--red-dk));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:13px;overflow:hidden;border:2px solid #fff;box-shadow:var(--sh-sm)}
.user-avatar-btn img{width:100%;height:100%;object-fit:cover}
.user-dropdown{position:absolute;top:calc(100% + 10px);right:0;width:220px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-md);padding:10px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:.15s ease;z-index:60}
.user-dropdown.open{opacity:1;visibility:visible;transform:translateY(0)}
.ud-head{padding:6px 8px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.ud-head .n{font-weight:700;font-size:13.5px;color:var(--ink)}
.ud-head .r{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.lang-toggle{display:flex;border-radius:9px;overflow:hidden;border:1px solid var(--line-2);margin:4px 0 8px}
.lang-toggle button{flex:1;padding:7px 0;font-size:11.5px;font-weight:700;color:var(--ink-3);background:var(--bg)}
.lang-toggle button.active{background:linear-gradient(180deg,var(--green-2),var(--green));color:#fff}
.lang-toggle button:not(.active):hover{background:var(--line)}
.ud-logout{width:100%;padding:9px 10px;border-radius:9px;background:var(--bg);color:var(--ink-2);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
.ud-logout:hover{background:var(--line)}

.tabbar-wrap{border-top:1px solid var(--line)}
.tabbar{max-width:1180px;margin:0 auto;padding:0 22px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{display:flex;align-items:center;gap:7px;padding:12px 14px;font-size:13.5px;font-weight:700;color:var(--ink-3);white-space:nowrap;border-bottom:2.5px solid transparent;flex-shrink:0}
.tabbar button .ic{font-size:14px}
.tabbar button:hover{color:var(--ink)}
.tabbar button.active{color:var(--red);border-bottom-color:var(--red)}

@media (max-width:640px){
  .topnav-inner{padding:12px 16px}
  .unit-badge{display:none}
  .prop-toggle{display:none}
  .brand-word{font-size:17px}
  .tabbar{padding:0 12px}
  .tabbar button{padding:11px 10px;font-size:12.5px}
}

/* ── Main ────────────────────────────────────────────────────────── */
.app-main{max-width:1180px;margin:0 auto;padding:26px 22px 70px;width:100%}
.app-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.app-head h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--ink);margin:0}
.app-head .sub{color:var(--ink-3);font-size:13.5px;margin-top:3px}
@media (max-width:640px){ .app-main{padding:18px 16px 56px} .app-head h1{font-size:20px} }

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-width:0;box-shadow:var(--sh-sm)}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.panel-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:15.5px;font-weight:700;color:var(--ink);margin:0}
.panel-sub{color:var(--ink-3);font-size:12px;margin-top:2px}

.two-col{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){ .two-col{grid-template-columns:minmax(0,1fr)} }

/* Rent hero */
.rent-hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:26px;box-shadow:var(--sh-sm);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.rent-hero .label{font-size:11px;letter-spacing:.7px;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.rent-hero .amt{font-family:'Plus Jakarta Sans',sans-serif;font-size:40px;font-weight:800;letter-spacing:-1px;color:var(--ink);margin:6px 0 4px;line-height:1}
.rent-hero .amt small{font-size:15px;color:var(--ink-3);font-weight:600;margin-left:3px}
.rent-hero .due{font-size:12.5px;font-weight:700}
.rent-hero .due.overdue{color:var(--red)}
.rent-hero .due.ok{color:var(--ink-2)}

/* Stat grid */
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
@media (max-width:900px){ .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:400px){ .stat-grid{grid-template-columns:minmax(0,1fr)} }
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 17px;box-shadow:var(--sh-sm)}
.cb-table{width:100%;border-collapse:collapse}
.cb-row{display:grid;grid-template-columns:1.4fr 1.2fr 1fr 1.4fr;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line)}
.cb-row.cb-head{border-top:none;padding-top:0;padding-bottom:8px}
.cb-head .cb-cell{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.3px}
.cb-cell{font-size:13.5px;color:var(--ink-2)}
.cb-action{text-align:right}
@media (max-width:640px){
  .cb-row{grid-template-columns:1fr 1fr;row-gap:4px}
  .cb-row.cb-head{display:none}
  .cb-action{grid-column:1/-1;text-align:left}
}
.stat-card .label{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.stat-card .val{font-family:'Plus Jakarta Sans',sans-serif;font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--ink);margin:5px 0 3px;line-height:1}
.stat-card .val.red{color:var(--red)}
.stat-card .val.green{color:var(--green)}
.stat-card .val.gold{color:var(--gold)}
.stat-card .val.blue{color:var(--blue)}
.stat-card .trend{font-size:11px;font-weight:600;color:var(--ink-3)}

.table{width:100%;border-collapse:collapse}
.table th{text-align:left;color:var(--ink-3);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.table td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink)}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:var(--bg)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.pill.paid,.pill.resolved,.pill.reported,.pill.done,.pill.signed{background:var(--green-lt);color:var(--green);border:1px solid #cdeacd}
.pill.pending,.pill.pending_signature,.pill.open,.pill.active{background:var(--blue-lt);color:var(--blue);border:1px solid #cfe6f2}
.pill.processing,.pill.in_progress{background:var(--gold-lt);color:var(--gold);border:1px solid #f0dcb4}
.pill.failed,.pill.overdue,.pill.emergency{background:var(--red-lt);color:var(--red);border:1px solid #f3cfcc}
.pill.closed{background:var(--bg);color:var(--ink-2);border:1px solid var(--line-2)}
.pill.preview{background:var(--gold-lt);color:var(--gold);border:1px solid #f0dcb4;letter-spacing:.8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:var(--r-full);font-weight:700;font-size:13.5px;transition:all .15s;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:linear-gradient(180deg,var(--red),var(--red-dk));color:#fff;box-shadow:0 8px 20px rgba(201,51,38,.28)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(201,51,38,.34)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-secondary{background:var(--bg);border:1px solid var(--line-2);color:var(--ink)}
.btn-secondary:hover{background:var(--line)}
.btn-green{background:linear-gradient(180deg,var(--green-2),var(--green));color:#fff;box-shadow:0 8px 20px rgba(45,125,45,.24)}
.btn-lg{padding:14px 22px;font-size:14.5px;border-radius:var(--r-full)}
.btn-block{width:100%}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px}

.field{margin-bottom:14px}
.field label{display:block;color:var(--ink-3);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:13.5px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red)}
.field input:disabled{color:var(--ink-2);opacity:.85;background:#f0f1f5}

.msg{margin-top:10px;font-size:13px}
.msg.ok{color:var(--green)}
.msg.err{color:var(--red)}

/* Credit score card */
.score-hero{background:linear-gradient(160deg,#fff 0%,var(--gold-lt) 130%);border:1px solid #f0dcb4;position:relative;overflow:hidden}
.preview-ribbon{position:absolute;top:14px;right:-32px;background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#2a1c00;font-size:10.5px;font-weight:800;letter-spacing:1px;padding:5px 40px;transform:rotate(35deg);box-shadow:0 4px 10px rgba(0,0,0,.15)}

/* Streak */
.streak{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.streak div{flex:1;min-width:22px;height:34px;border-radius:8px;background:var(--green-lt);border:1px solid #cdeacd;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700}
.streak div.miss{background:var(--red-lt);border-color:#f3cfcc;color:var(--red)}

/* Coach */
.coach-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:0;overflow:hidden;box-shadow:var(--sh-sm)}
.coach-head-bar{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;background:var(--bg)}
.chat-avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--green-2),var(--green));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.coach-feed{height:340px;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.coach-foot{padding:14px 20px;border-top:1px solid var(--line)}
.bubble{padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.5;max-width:88%;margin-bottom:6px;white-space:pre-wrap}
.bubble.user{background:linear-gradient(180deg,var(--red),var(--red-dk));color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.bubble.ai{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:5px}
.bubble.sys{background:var(--gold-lt);border:1px solid #f0dcb4;color:var(--ink-2);font-size:12.5px;text-align:center;max-width:100%;margin:0 auto 6px}
.chat-input{display:flex;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:5px 5px 5px 12px;align-items:center}
.chat-input input{flex:1;background:transparent;border:none;color:var(--ink);font-size:13.5px;outline:none;padding:8px 0}
.chat-input button{width:36px;height:36px;border-radius:9px;background:linear-gradient(180deg,var(--green-2),var(--green));color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.chat-input button:disabled{opacity:.5}

/* Goals */
.goal-card{padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:13px;margin-bottom:10px}
.goal-card.done{background:var(--green-lt);border-color:#cdeacd}
.goal-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.goal-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green-2));border-radius:99px}

/* Maintenance photo */
.thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;border:1px solid var(--line-2);cursor:pointer}
.upload-box{border:1.5px dashed var(--line-2);border-radius:12px;padding:14px;text-align:center;color:var(--ink-3);font-size:12.5px;cursor:pointer;display:block}
.upload-box:hover{border-color:var(--red);color:var(--ink-2)}
.upload-preview{margin-top:10px;display:flex;align-items:center;gap:10px}
.upload-preview img{width:60px;height:60px;border-radius:10px;object-fit:cover;border:1px solid var(--line-2)}

/* Office hub */
.office-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.office-tab{padding:9px 16px;border-radius:var(--r-full);font-size:12.5px;font-weight:700;background:var(--card);color:var(--ink-2);border:1px solid var(--line);display:flex;align-items:center;gap:6px}
.office-tab:hover{background:var(--bg)}
.office-tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.empty{color:var(--ink-3);text-align:center;padding:22px;font-size:13px}
.loading-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--ink-3);width:100%;background:var(--bg)}
</style>
</head>
<body>

<div id="loadingScreen" class="loading-screen">Loading your account…</div>

<div id="appShell" style="display:none;width:100%">
  <header class="topnav">
    <div class="topnav-inner">
      <a class="brand" href="#" onclick="setView('overview');return false;">
        <span class="brand-word"><span class="b3">R</span><span class="b1">ent</span><span class="b3">Pay</span><span class="b4">EZ</span></span>
      </a>
      <div class="topnav-right">
        <div class="prop-toggle" id="propToggle"></div>
        <div class="unit-badge" id="unitBadge"></div>
        <div class="user-menu" id="userMenu">
          <button class="user-avatar-btn" id="userAvatarBtn" aria-label="Account menu"></button>
          <div class="user-dropdown" id="userDropdown">
            <div class="ud-head"><div class="n" id="udName">—</div><div class="r" id="udRole">—</div></div>
            <div class="lang-toggle" id="langToggle">
              <button id="langBtnEn" onclick="setLang('en')">EN</button>
              <button id="langBtnEs" onclick="setLang('es')">ES</button>
            </div>
            <button class="ud-logout" onclick="logout()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
              <span id="signOutLabel">Sign out</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="tabbar-wrap"><nav class="tabbar" id="tabbar"></nav></div>
  </header>
  <main class="app-main" id="appMain"></main>
</div>

<script>
/* ═══════════════════════════ i18n (English / Español) ═══════════════════════════ */
const I18N = {
  en: {
    nav_overview:'Overview', nav_payments:'Payments', nav_maintenance:'Maintenance',
    nav_inspections:'Inspections', nav_credit:'Credit', nav_office:'Office',
    type_apartment:'Apartment', type_property:'Property',
    office_documents:'Documents', office_coach:'AI Coach', office_goals:'My Goals', office_settings:'Settings',
    sign_out:'Sign out', resident:'Resident', unit_n:'Unit {{n}}',
    loading_account:'Loading your account…', loading:'Loading…',
    welcome_back:'Welcome back, {{name}} 👋', your_resident_portal:'Your resident portal',
    greeting_morning:'Good morning, {{name}} 👋', greeting_afternoon:'Good afternoon, {{name}} 👋', greeting_evening:'Good evening, {{name}} 👋',
    overview_snapshot_at:"Here's a snapshot of your rental at {{address}}, Unit {{unit}}.", overview_snapshot_plain:"Here's a snapshot of your rental.",
    rent_due_eyebrow:'{{month}} Rent Due',
    lease_ends:'Lease Ends', lease_not_set_sub:'Not set yet', lease_ended:'Lease ended', lease_ends_this_month:'Ends this month',
    months_left:'{{n}} months left', month_left:'1 month left',
    credit_score:'Credit Score', preview:'Preview', not_connected_yet:'Not connected yet',
    on_time_payments:'On-Time Payments', of_last_12:'{{n}}/12 this year', pct_this_year:'{{pct}}% this year',
    total_paid_on_record:'Total Paid on Record', payment_n:'{{n}} payment', payments_n:'{{n}} payments',
    open_requests:'Open Requests', total_filed_n:'{{n}} total filed',
    rent_due_title:'Rent Due', no_rent_on_file:'No rent amount on file yet',
    last_12_months:'Last 12 months', months_with_payment:'Months with a recorded payment',
    recent_maintenance:'Recent maintenance', request_n_filed:'{{n}} request filed', requests_n_filed:'{{n}} requests filed',
    view_all:'View All →', no_maintenance_yet:'No maintenance requests yet.',
    streak_legend:'Green = a payment was recorded that month. Red = none on file.',
    credit_score_title:'Credit score', sample_data_sub:"Sample data — rent-payment credit reporting isn't connected to your account yet",
    sample_good_range:'Sample · Good range', sample_card_desc:'This is what your score card will look like once your organization turns on rent-payment credit reporting.',

function t(key, vars){
  let s = (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;
  if(vars) Object.keys(vars).forEach(k => { s = s.split('{{'+k+'}}').join(vars[k]); });
  return s;
}
function statusLabel(s){ return t('status_' + String(s||'').toLowerCase()) !== 'status_' + String(s||'').toLowerCase() ? t('status_' + String(s||'').toLowerCase()) : String(s||'').replace('_',' '); }

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function money(cents){ return '$' + (cents/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

async function boot(){
  document.getElementById('loadingScreen').textContent = t('loading_account');
  try{
    const meRes = await fetch('/api/tenant-auth/me');
    if(!meRes.ok){ window.location.href = 'login.html'; return; }
    ME = (await meRes.json()).tenant;

    const res = await fetch('/api/tenant/me');
    if(!res.ok) throw new Error(t('could_not_load_account'));
    T = await res.json();

    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('appShell').style.display = 'flex';

    renderNav();
    await handleStripeReturn();
    setView('overview');
  }catch(err){
    document.getElementById('loadingScreen').textContent = err.message;
  }
}

function renderNav(){
  document.getElementById('tabbar').innerHTML = NAV.map(n =>
    `<button class="${n.id===VIEW?'active':''}" onclick="setView('${n.id}')"><span class="ic">${n.ic}</span><span>${esc(t(n.key))}</span></button>`
  ).join('');

  const initials = (T.name||'?').split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
  const av = T.has_avatar
    ? `<img src="/api/tenant/me/avatar?v=${AVATAR_V}" alt=""/>`
    : esc(initials);

  document.getElementById('udName').textContent = T.name;

    `<span class="u">${esc(T.unit_number ? t('unit_n',{n:T.unit_number}) : t('resident'))}</span>
     <span class="a">${esc(T.property_address || T.property_name || '')}</span>`;
  // Honest, data-driven label — not a functional switcher. A unit tied to a
  // building record is classified "Apartment"; a standalone unit is
  // classified "Property". Reflects real data, never toggled by a click.
  const isApartment = !!T.building_id;

    `<span class="${isApartment?'active':''}">${esc(t('type_apartment'))}</span>
     <span class="${isApartment?'':'active'}">${esc(t('type_property'))}</span>`;
  document.getElementById('langBtnEn').classList.toggle('active', LANG==='en');
  document.getElementById('langBtnEs').classList.toggle('active', LANG==='es');
  document.getElementById('signOutLabel').textContent = t('sign_out');
}

function wireUserMenu(){
  const btn = document.getElementById('userAvatarBtn');
  const dd = document.getElementById('userDropdown');
  if(btn.dataset.wired) return;
  btn.dataset.wired = '1';
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    dd.classList.toggle('open');
  });
  document.addEventListener('click', function(){ dd.classList.remove('open'); });
}

async function setView(id){
  VIEW = id;
  renderNav();
  wireUserMenu();
  const m = document.getElementById('appMain');
  m.innerHTML = `<div class="empty">${t('loading')}</div>`;
  const renderers = {
    overview: renderOverview, payments: renderPayments, maintenance: renderMaintenance,
    inspections: renderInspections, credit: renderCredit, office: () => renderOffice(OFFICE_SUB)
  };
  await renderers[id]();
  window.scrollTo?.({top:0});
}

/* ═══════════════════════════ RENT REMINDER (in-app only) ═══════════════════════════ */
// No email/SMS is sent — this reads T.rent_reminder, computed server-side
// by the same logic staff see in their Rent Reminders tab (see
// services/reminders.js), from the unit's rent_due_day and whether a
// payment already exists for the current calendar month.
function reminderBannerHtml(){
  const r = T.rent_reminder;
  if(!r || r.status === 'no_due_day' || r.status === 'paid' || r.status === 'upcoming') return '';
  const overdue = r.status === 'overdue';
  const due = r.dueDay + ordinal(r.dueDay);
  const text = overdue
    ? t('rent_overdue', {days: Math.abs(r.daysUntilDue), s: Math.abs(r.daysUntilDue)===1?'':'s', due})
    : r.daysUntilDue === 0
      ? t('rent_due_today', {due})
      : t('rent_due_in', {days: r.daysUntilDue, s: r.daysUntilDue===1?'':'s', due});
  return `
    <div style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:13px;margin-bottom:18px;
      background:${overdue?'var(--red-lt)':'var(--gold-lt)'};
      border:1px solid ${overdue?'#f3cfcc':'#f0dcb4'}">
      <div style="font-size:18px">${overdue?'⚠️':'⏰'}</div>
      <div style="flex:1;color:var(--ink);font-size:13.5px">${text}</div>
      <button class="btn btn-sm ${overdue?'btn-primary':'btn-secondary'}" onclick="setView('payments')">${esc(t('pay_now'))}</button>
    </div>
  `;
}
function ordinal(n){ if(!n) return ''; const s=['th','st','nd','rd'], v=n%100; return s[(v-20)%10]||s[v]||s[0]; }

/* ═══════════════════════════ OVERVIEW ═══════════════════════════ */
function greetingText(){
  const hour = new Date().getHours();
  const key = hour < 12 ? 'greeting_morning' : hour < 18 ? 'greeting_afternoon' : 'greeting_evening';
  return t(key, {name:(T.name||'').split(' ')[0]});
}
function rentDueLineText(){
  const r = T.rent_reminder;
  if(!r || r.status === 'no_due_day') return '';
  if(r.status === 'paid') return t('rent_paid_this_month');
  const due = r.dueDay + ordinal(r.dueDay);
  if(r.status === 'overdue') return t('rent_overdue', {days: Math.abs(r.daysUntilDue), s: Math.abs(r.daysUntilDue)===1?'':'s', due});
  if(r.daysUntilDue === 0) return t('rent_due_today', {due});
  return t('rent_due_in', {days: r.daysUntilDue, s: r.daysUntilDue===1?'':'s', due});
}
// lease_end_date is a DATE column but the API may serialize it as a full
// ISO timestamp (e.g. "2027-05-15T00:00:00.000Z"). Parsing that with `new
// Date()` and formatting in the browser's local timezone can shift the
// displayed day backward. Pull the YYYY-MM-DD out directly and build a
// local Date from its parts so the calendar day never moves.
function leaseEndDateParts(){
  if(!T.lease_end_date) return null;
  const m = String(T.lease_end_date).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return null;
  return { y: Number(m[1]), mo: Number(m[2]), d: Number(m[3]) };
}
function leaseEndsVal(){
  const parts = leaseEndDateParts();
  if(!parts) return t('lease_not_set_sub');
  return new Date(parts.y, parts.mo-1, parts.d).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}
function leaseEndsTrend(){
  const parts = leaseEndDateParts();
  if(!parts) return '';
  const end = new Date(parts.y, parts.mo-1, parts.d);
  const now = new Date();
  const months = (end.getFullYear()-now.getFullYear())*12 + (end.getMonth()-now.getMonth());
  if(months < 0) return t('lease_ended');
  if(months === 0) return t('lease_ends_this_month');
  if(months === 1) return t('month_left');
  return t('months_left', {n: months});
}

function catLabel(c){ return t('cat_' + String(c||'').toLowerCase()) !== 'cat_' + String(c||'').toLowerCase() ? t('cat_' + String(c||'').toLowerCase()) : c; }

function computeOnTime(payments){
  const months = new Set(payments.map(p => new Date(p.paid_at).toISOString().slice(0,7)));
  const cursor = new Date();
  cursor.setDate(1);
  cursor.setMonth(cursor.getMonth()-11);
  let count = 0;
  for(let i=0;i<12;i++){
    const key = cursor.toISOString().slice(0,7);
    if(months.has(key)) count++;
    cursor.setMonth(cursor.getMonth()+1);
  }
  return { count, pct: Math.round((count/12)*100) };
}

async function viewInspection(id){
  try{
    const insp = await fetch(`/api/tenant/inspections/${id}`).then(r=>r.json());
    const conditionColor = c => c==='good' ? 'var(--green)' : c==='fair' ? 'var(--gold)' : 'var(--red)';
    const card = document.getElementById('insp-detail');
    card.innerHTML = `
      <h3 class="panel-title" style="margin-bottom:4px">${esc(inspTypeLabel(insp.inspection_type))} ${esc(t('inspection_suffix'))}</h3>
      <div class="panel-sub" style="margin-bottom:14px">${new Date(insp.created_at).toLocaleString()}</div>
      ${insp.overall_notes ? `<p style="color:var(--ink-2);font-size:13.5px;margin-bottom:14px">${esc(insp.overall_notes)}</p>` : ''}
      ${insp.items.map(it=>`
        <div style="display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)">
          ${it.has_photo ? `<img class="thumb" src="/api/tenant/inspections/${insp.id}/items/${it.id}/photo" onclick="window.open(this.src,'_blank')"/>` : `<div class="thumb" style="display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink-3);font-size:18px">📝</div>`}
          <div style="flex:1">
            <div style="color:var(--ink);font-weight:600;font-size:13.5px">${esc(it.room)} — <span style="color:${conditionColor(it.condition)}">${esc(it.condition)}</span></div>
            ${it.notes ? `<div style="color:var(--ink-3);font-size:12.5px;margin-top:3px">${esc(it.notes)}</div>` : ''}
          </div>
        </div>`).join('')}
    `;
    card.style.display = '';
    card.scrollIntoView({ behavior: 'smooth' });
  }catch(err){ alert('Could not load inspection.'); }
}

/* ═══════════════════════════ OFFICE (hub: Documents / AI Coach / My Goals / Settings) ═══════════════════════════ */
function renderOffice(sub){
  OFFICE_SUB = sub || 'documents';
  document.getElementById('appMain').innerHTML = `
    <div class="app-head"><div><h1>${esc(t('nav_office'))}</h1></div></div>
    <div class="office-tabs" id="officeTabs">
      ${OFFICE_TABS.map(o=>`<button class="office-tab ${o.id===OFFICE_SUB?'active':''}" onclick="setOfficeSub('${o.id}')"><span>${o.ic}</span><span>${esc(t(o.key))}</span></button>`).join('')}
    </div>
    <div id="officeBody"></div>
  `;
  const runners = { documents: renderDocuments, coach: renderCoach, goals: renderGoals, settings: renderSettings };
  runners[OFFICE_SUB]();
}
function setOfficeSub(id){
  renderOffice(id);
}

/* ── Documents ── */
async function renderDocuments(){
  const rows = await fetch('/api/tenant/documents').then(r=>r.ok?r.json():[]);
  document.getElementById('officeBody').innerHTML = `
    <div class="panel" style="margin-bottom:14px"><div class="panel-sub">${esc(t('documents_sub'))}</div></div>
    <div class="panel" style="padding:0">
      <table class="table">
        <thead><tr><th>${esc(t('doc_title'))}</th><th>${esc(t('type'))}</th><th>${esc(t('status'))}</th><th></th></tr></thead>
        <tbody>
          ${rows.length ? rows.map(d=>{
            const action = d.status === 'pending_signature'
              ? `<button class="btn btn-sm btn-primary" onclick="signDocument('${d.id}')">${esc(t('sign'))}</button>`
              : `<a class="btn btn-sm btn-secondary" href="/api/tenant/documents/${d.id}/file" target="_blank">${esc(t('view'))}</a>`;
            return `<tr>
              <td style="color:var(--ink);font-weight:600">${esc(d.title)}</td>
              <td style="text-transform:capitalize">${esc(d.doc_type)}</td>
              <td><span class="pill ${esc(d.status)}">${esc(statusLabel(d.status))}</span>${d.signed_name?`<div style="color:var(--ink-3);font-size:11px;margin-top:2px">${esc(t('signed_by',{name:d.signed_name}))}</div>`:''}</td>
              <td>${action}</td>
            </tr>`;
          }).join('') : `<tr><td colspan="4"><div class="empty">${esc(t('nothing_here_yet'))}</div></td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}
async function signDocument(id){
  const name = window.prompt(t('sign_prompt'));
  if(!name || !name.trim()) return;
  try{
    const res = await fetch(`/api/tenant/documents/${id}/sign`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({signedName:name}) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || t('could_not_sign'));
    await renderDocuments();
  }catch(err){ alert(err.message); }
}

/* ── AI Coach ── */
async function renderCoach(){
  document.getElementById('officeBody').innerHTML = `
    <div class="panel" style="margin-bottom:14px"><div class="panel-sub">${esc(t('coach_sub'))}</div></div>
    <div class="coach-panel">
      <div class="coach-head-bar">
        <div class="chat-avatar">🤖</div>
        <div style="flex:1"><div style="color:var(--ink);font-weight:700;font-size:14.5px">${esc(t('coach_name'))}</div><div style="color:var(--ink-3);font-size:11.5px">${esc(t('grounded_in'))}</div></div>
      </div>
      <div class="coach-feed" id="coachFeed"></div>
      <div class="coach-foot">
        <div class="chat-input">
          <input id="coachIn" placeholder="${esc(t('ask_anything'))}" onkeydown="if(event.key==='Enter')sendCoach()"/>
          <button id="coachSendBtn" onclick="sendCoach()">→</button>
        </div>
      </div>
    </div>
  `;
  COACH_HISTORY = [];
  renderCoachFeed();
  appendCoachSystemGreeting();
}
function renderCoachFeed(){
  const feed = document.getElementById('coachFeed');
  if(!feed) return;
  feed.innerHTML = COACH_HISTORY.map(m => m.role === 'sys'
    ? `<div class="bubble sys">${esc(m.content)}</div>`
    : `<div class="bubble ${m.role==='user'?'user':'ai'}">${esc(m.content)}</div>`
  ).join('');
  feed.scrollTop = feed.scrollHeight;
}
function appendCoachSystemGreeting(){
  COACH_HISTORY.push({role:'sys', content: t('coach_greeting', {name:(T.name||'').split(' ')[0]})});
  renderCoachFeed();
}
async function sendCoach(){
  const input = document.getElementById('coachIn');
  const btn = document.getElementById('coachSendBtn');
  const text = input.value.trim();
  if(!text) return;
  COACH_HISTORY.push({role:'user', content:text});
  renderCoachFeed();
  input.value = '';
  btn.disabled = true;
  try{
    const historyForApi = COACH_HISTORY.filter(m=>m.role==='user'||m.role==='assistant').slice(-10);
    const res = await fetch('/api/tenant/coach/message', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message:text, history: historyForApi.slice(0,-1), language: LANG }) });
    const data = await res.json();
    if(!res.ok){
      COACH_HISTORY.push({role:'sys', content: data.error || t('coach_unavailable')});
    } else {
      COACH_HISTORY.push({role:'assistant', content: data.reply});
    }
  }catch(err){
    COACH_HISTORY.push({role:'sys', content: t('coach_error')});
  }
  btn.disabled = false;
  renderCoachFeed();
}

/* ── My Goals ── */
async function renderGoals(){
  const goals = await fetch('/api/tenant/goals').then(r=>r.ok?r.json():[]);
  document.getElementById('officeBody').innerHTML = `
    <div class="panel" style="margin-bottom:14px"><div class="panel-sub">${esc(t('goals_sub'))}</div></div>
    <div class="two-col">
      <div class="panel">
        <h3 class="panel-title" style="margin-bottom:14px">${esc(t('add_goal'))}</h3>
        <div class="field"><label>${esc(t('title_label'))}</label><input id="goal-title" placeholder="${esc(t('goal_title_ph'))}"/></div>
        <div class="field"><label>${esc(t('notes_optional'))}</label><input id="goal-note" placeholder="${esc(t('goal_note_ph'))}"/></div>
        <button class="btn btn-primary btn-block" onclick="addGoal()">${esc(t('add_goal_btn'))}</button>
        <div id="goal-msg" class="msg"></div>
      </div>
      <div class="panel">
        <h3 class="panel-title" style="margin-bottom:14px">${esc(t('your_goals'))}</h3>
        <div id="goal-list">${renderGoalList(goals)}</div>
      </div>
    </div>
  `;
}
function renderGoalList(goals){
  if(!goals.length) return `<div class="empty">${esc(t('no_goals_yet'))}</div>`;
  return goals.map(g => `
    <div class="goal-card ${g.status==='done'?'done':''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div><div style="color:var(--ink);font-weight:600;font-size:14px">${esc(g.title)}</div>${g.target_note?`<div style="color:var(--ink-3);font-size:12px;margin-top:2px">${esc(g.target_note)}</div>`:''}</div>
        <span class="pill ${g.status==='done'?'done':'in_progress'}">${g.status==='done'?esc(t('done')):g.progress_pct+'%'}</span>
      </div>
      <div class="goal-bar"><i style="width:${g.progress_pct}%"></i></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        ${g.status!=='done' ? `
          <button class="btn btn-sm btn-secondary" onclick="bumpGoal('${g.id}', ${Math.min(100,g.progress_pct+10)})">+10%</button>
          <button class="btn btn-sm btn-secondary" onclick="completeGoal('${g.id}')">${esc(t('mark_done'))}</button>
        ` : ''}
        <button class="btn btn-sm btn-secondary" onclick="deleteGoal('${g.id}')">${esc(t('delete'))}</button>
      </div>
    </div>
  `).join('');
}
async function addGoal(){
  const title = document.getElementById('goal-title').value.trim();
  const targetNote = document.getElementById('goal-note').value.trim();
  const msg = document.getElementById('goal-msg');
  try{
    if(!title) throw new Error(t('give_goal_title'));
    const res = await fetch('/api/tenant/goals', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({title, targetNote}) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || t('could_not_add_goal'));
    await renderGoals();
  }catch(err){ msg.className='msg err'; msg.textContent = err.message; }
}
async function bumpGoal(id, pct){
  await fetch(`/api/tenant/goals/${id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({progressPct: pct}) });
  await renderGoals();
}
async function completeGoal(id){
  await fetch(`/api/tenant/goals/${id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({progressPct: 100, status: 'done'}) });
  await renderGoals();
}
async function deleteGoal(id){
  if(!confirm(t('delete_goal_confirm'))) return;
  await fetch(`/api/tenant/goals/${id}`, { method:'DELETE' });
  await renderGoals();
}

/* ── Settings ── */
async function renderSettings(){
  document.getElementById('officeBody').innerHTML = `
    <div class="two-col">
      <div class="panel">
        <h3 class="panel-title" style="margin-bottom:14px">${esc(t('profile_photo'))}</h3>
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px">
          <div id="avatar-preview" style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--red-dk));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:20px;flex-shrink:0;overflow:hidden">
            ${T.has_avatar ? `<img src="/api/tenant/me/avatar?v=${AVATAR_V}" alt="" style="width:100%;height:100%;object-fit:cover"/>` : esc((T.name||'?').split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase())}
          </div>
          <div style="flex:1">
            <input type="file" id="avatar-file" accept="image/*" onchange="onAvatarSelected(event)" style="font-size:12.5px"/>
            <div style="margin-top:8px;display:flex;gap:8px">
              <button class="btn btn-primary btn-sm" onclick="saveAvatar()">${esc(t('upload_photo'))}</button>
              ${T.has_avatar ? `<button class="btn btn-secondary btn-sm" onclick="removeAvatar()">${esc(t('remove_photo'))}</button>` : ''}
            </div>
          </div>
        </div>
        <div id="avatar-msg" class="msg"></div>
      </div>
      <div class="panel">
        <h3 class="panel-title" style="margin-bottom:14px">${esc(t('your_home'))}</h3>
        <div class="field"><label>${esc(t('property'))}</label><input disabled value="${esc(T.property_name || t('not_yet_assigned'))}"/></div>
        <div class="field"><label>${esc(t('address'))}</label><input disabled value="${esc(T.property_address || '—')}"/></div>
        <div class="field"><label>${esc(t('unit'))}</label><input disabled value="${esc(T.unit_number || '—')}"/></div>
        <div class="field"><label>${esc(t('monthly_rent'))}</label><input disabled value="${T.monthly_rent ? '$'+Number(T.monthly_rent).toLocaleString() : '—'}"/></div>
        ${(T.emergency_contact_name || T.emergency_contact_phone) ? `
          <div class="field"><label>${esc(t('emergency_contact'))}</label><input disabled value="${esc(T.emergency_contact_name||'')}${T.emergency_contact_phone?' · '+esc(T.emergency_contact_phone):''}"/></div>
        ` : ''}
      </div>
      <div class="panel">
        <h3 class="panel-title" style="margin-bottom:14px">${esc(t('your_contact_info'))}</h3>
        <div class="field"><label>${esc(t('name'))}</label><input disabled value="${esc(T.name)}"/></div>
        <div class="field"><label>${esc(t('email'))}</label><input disabled value="${esc(T.email)}"/></div>
        <div class="field"><label>${esc(t('phone'))}</label><input id="f-phone" value="${esc(T.phone||'')}" placeholder="${esc(t('phone_ph'))}"/></div>
        <button class="btn btn-primary" onclick="saveProfile()">${esc(t('save_phone'))}</button>
        <div id="profile-msg" class="msg"></div>
      </div>
    </div>
  `;
}
function onAvatarSelected(e){
  const file = e.target.files[0];
  if(!file) return;
  if(file.size > 2.2*1024*1024){
    document.getElementById('avatar-msg').className = 'msg err';
    document.getElementById('avatar-msg').textContent = t('photo_too_large_av');
    e.target.value = ''; return;
  }
  const reader = new FileReader();
  reader.onload = () => { PENDING_AVATAR = { base64: reader.result.split(',')[1], mime: file.type }; };
  reader.readAsDataURL(file);
}
async function saveAvatar(){
  const msg = document.getElementById('avatar-msg');
  if(!PENDING_AVATAR){ msg.className = 'msg err'; msg.textContent = t('choose_photo_first'); return; }
  try{
    const res = await fetch('/api/tenant/me/avatar', { method:'PATCH', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ avatarBase64: PENDING_AVATAR.base64, avatarMime: PENDING_AVATAR.mime }) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || t('could_not_save_photo'));
    T.has_avatar = true; PENDING_AVATAR = null; AVATAR_V++;
    msg.className = 'msg ok'; msg.textContent = t('photo_updated');
    renderNav(); renderSettings();
  }catch(err){ msg.className = 'msg err'; msg.textContent = err.message; }
}
async function removeAvatar(){
  const msg = document.getElementById('avatar-msg');
  try{
    const res = await fetch('/api/tenant/me/avatar', { method:'DELETE' });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || t('could_not_remove_photo'));
    T.has_avatar = false; AVATAR_V++;
    renderNav(); renderSettings();
  }catch(err){ msg.className = 'msg err'; msg.textContent = err.message; }
}
async function saveProfile(){
  const phone = document.getElementById('f-phone').value.trim();
  const msg = document.getElementById('profile-msg');
  try{
    const res = await fetch('/api/tenant/me', { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({phone}) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || t('could_not_save'));
    T.phone = phone;
    msg.className = 'msg ok'; msg.textContent = t('saved');
  }catch(err){ msg.className = 'msg err'; msg.textContent = err.message; }
}

async function logout(){
  await fetch('/api/tenant-auth/logout', { method:'POST' });
  window.location.href = 'login.html';
}

boot();
</script>
