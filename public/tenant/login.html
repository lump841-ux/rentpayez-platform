<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RentPayEZ — Resident Login</title>
<link rel="icon" type="image/png" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&family=DM+Sans:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#c93326; --red-dk:#a32d2d;
  --green:#2d7d2d; --green-2:#3a9c3a;
  --navy:#0f1626;
  --ink:#14161c; --ink-2:#5c6270; --ink-3:#9096a3;
  --line:#e8e9f0; --line-2:#d9dbe6;
  --bg:#f5f6fa; --card:#ffffff;
  --sh-md:0 8px 24px rgba(20,22,28,.06), 0 2px 6px rgba(20,22,28,.04);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100vh}
body{
  background:var(--bg);
  color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center
}
a{color:inherit}
.wrap{width:100%;max-width:400px;padding:24px}
.brand-row{display:flex;align-items:baseline;justify-content:center;margin-bottom:32px}
.brand-word{font-family:'DM Sans','Inter',sans-serif;font-size:40px;font-weight:900;letter-spacing:-0.085em;line-height:0.9;white-space:nowrap}
.brand-word .b1{color:#000}
.brand-word .b3{color:#dc2626}
.brand-word .b4{color:#22c55e}
.sub{color:var(--ink-3);font-size:13.5px;text-align:center;margin-bottom:26px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:var(--sh-md)}
.card-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:800;color:var(--ink);text-align:center;margin:0 0 6px;letter-spacing:-.3px}
.card-sub{color:var(--ink-3);font-size:13.5px;text-align:center;margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;color:var(--ink);font-size:12.5px;font-weight:700;margin-bottom:6px}
.field-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.field-head label{margin-bottom:0}
.forgot-link{font-size:12px;font-weight:700;color:var(--red);cursor:pointer;background:none;border:none;padding:0;font-family:inherit}
.forgot-link:hover{text-decoration:underline}
.field input{width:100%;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;color:var(--ink);font-size:14px;outline:none;font-family:inherit}
.field input:focus{border-color:var(--red)}
.btn-primary{width:100%;padding:13px;border-radius:11px;font-weight:700;font-size:14.5px;background:linear-gradient(180deg,var(--red),var(--red-dk));color:#fff;border:none;cursor:pointer;box-shadow:0 8px 22px rgba(201,51,38,0.3)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-secondary{width:100%;padding:13px;border-radius:11px;font-weight:700;font-size:14.5px;background:var(--navy);color:#fff;border:none;cursor:pointer;margin-top:10px}
.btn-secondary:hover{transform:translateY(-1px)}
.msg{margin-top:12px;font-size:13px;text-align:center}
.msg.err{color:#c93326}
.msg.info{color:var(--ink-2)}
.foot{text-align:center;color:var(--ink-3);font-size:12.5px;margin-top:20px}
.foot a{color:var(--red);font-weight:700}
.lang-toggle{display:flex;justify-content:center;gap:6px;margin-bottom:18px}
.lang-toggle button{padding:6px 14px;border-radius:99px;font-size:11.5px;font-weight:700;color:var(--ink-3);border:1px solid var(--line-2);background:var(--card)}
.lang-toggle button.active{background:linear-gradient(180deg,var(--green-2),var(--green));color:#fff;border-color:var(--green)}
.lang-toggle button:not(.active):hover{background:var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand-row">
    <span class="brand-word"><span class="b3">R</span><span class="b1">ent</span><span class="b3">Pay</span><span class="b4">EZ</span></span>
  </div>
  <div class="lang-toggle" id="langToggle">
    <button id="langBtnEn" onclick="setLang('en')">EN</button>
    <button id="langBtnEs" onclick="setLang('es')">ES</button>
  </div>

  <div class="card">
    <h1 class="card-title" id="cardTitle">Welcome back</h1>
    <div class="card-sub" id="loginSub">Sign in to your RentPayEZ account</div>
    <div class="field"><label id="lblEmail">Email Address</label><input id="li-email" type="email" placeholder="you@example.com" /></div>
    <div class="field">
      <div class="field-head"><label id="lblPassword">Password</label><button type="button" class="forgot-link" id="btnForgot" onclick="showForgot()">Forgot password?</button></div>
      <input id="li-password" type="password" placeholder="Enter your password" />
    </div>
    <button class="btn-primary" onclick="doLogin()" id="btnSignIn">Sign In as Tenant</button>
    <button type="button" class="btn-secondary" id="btnLandlord" onclick="window.location.href='/admin/login.html'">Sign In as Landlord</button>
    <div id="li-msg" class="msg"></div>
  </div>
</div>

<script>
const I18N_LOGIN = {
  en: { title:'Welcome back', sub:'Sign in to your RentPayEZ account', email:'Email Address', password:'Password', forgot:'Forgot password?', forgot_msg:'Password resets are handled by your property manager — contact their office and they can set you a new temporary password.', sign_in:'Sign In as Tenant', sign_in_landlord:'Sign In as Landlord', login_failed:'Login failed' },
  es: { title:'Bienvenido de nuevo', sub:'Inicia sesión en tu cuenta de RentPayEZ', email:'Correo electrónico', password:'Contraseña', forgot:'¿Olvidaste tu contraseña?', forgot_msg:'Los restablecimientos de contraseña los gestiona tu administrador de propiedad — contacta su oficina y podrán asignarte una nueva contraseña temporal.', sign_in:'Iniciar Sesión como Inquilino', sign_in_landlord:'Iniciar Sesión como Propietario', login_failed:'No se pudo iniciar sesión' }
};
let LANG = localStorage.getItem('rpz_lang') === 'es' ? 'es' : 'en';
function applyLang(){
  const d = I18N_LOGIN[LANG];
  document.getElementById('cardTitle').textContent = d.title;
  document.getElementById('loginSub').textContent = d.sub;
  document.getElementById('lblEmail').textContent = d.email;
  document.getElementById('lblPassword').textContent = d.password;
  document.getElementById('btnForgot').textContent = d.forgot;
  document.getElementById('btnSignIn').textContent = d.sign_in;
  document.getElementById('btnLandlord').textContent = d.sign_in_landlord;
  document.getElementById('langBtnEn').classList.toggle('active', LANG==='en');
  document.getElementById('langBtnEs').classList.toggle('active', LANG==='es');
}
function setLang(l){ LANG = l; localStorage.setItem('rpz_lang', l); applyLang(); }
applyLang();
function showForgot(){
  const msg = document.getElementById('li-msg');
  msg.className = 'msg info';
  msg.textContent = I18N_LOGIN[LANG].forgot_msg;
}
async function doLogin(){
  const email = document.getElementById('li-email').value.trim();
  const password = document.getElementById('li-password').value;
  const msg = document.getElementById('li-msg');
  msg.className='msg'; msg.textContent='';
  try{
    const res = await fetch('/api/tenant-auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email,password}) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || I18N_LOGIN[LANG].login_failed);
    window.location.href = 'portal.html';
  }catch(err){ msg.className='msg err'; msg.textContent = err.message; }
}
document.getElementById('li-password').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
