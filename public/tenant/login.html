<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>rentpayez — Resident Login</title>
<link rel="icon" type="image/png" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brick:#8b2424; --brick-2:#a32d2d; --brick-3:#c93e3e;
  --green:#2d7d2d; --green-2:#3a9c3a; --green-3:#5bc05b;
  --gold:#d4a247; --gold-2:#e8c074;
  --ink:#e9eef5; --ink-2:#b8c4d4; --ink-3:#7c8a9d;
  --line:rgba(255,255,255,0.08); --line-2:rgba(255,255,255,0.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100vh}
body{
  background:
    radial-gradient(1200px 800px at 12% -10%, rgba(139,36,36,0.16), transparent 60%),
    radial-gradient(1200px 800px at 95% 5%, rgba(45,125,45,0.12), transparent 60%),
    linear-gradient(180deg, #07121f 0%, #0a1a2c 35%, #07121f 100%);
  color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center
}
a{color:inherit}
.wrap{width:100%;max-width:400px;padding:24px}
.brand-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,#1a3552,#0b1a2a);display:flex;align-items:center;justify-content:center;border:1px solid var(--line-2)}
.brand-word{font-family:'Plus Jakarta Sans',sans-serif;font-size:21px;font-weight:800;letter-spacing:-0.4px}
.brand-word .b1{color:#fff}
.brand-word .b2{color:#0b0b0b;background:#fff;border-radius:5px;padding:0 4px;margin-right:1px}
.brand-word .b3{color:var(--brick-3)}
.brand-word .b4{color:var(--green-3)}
.sub{color:var(--ink-3);font-size:13.5px;text-align:center;margin-bottom:26px;line-height:1.5}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.05),rgba(255,255,255,0.02));border:1px solid var(--line);border-radius:18px;padding:22px}
.field{margin-bottom:14px}
.field label{display:block;color:var(--ink-3);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.field input{width:100%;background:rgba(0,0,0,0.25);border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;color:#fff;font-size:14px;outline:none;font-family:inherit}
.field input:focus{border-color:var(--brick-3)}
.btn-primary{width:100%;padding:12px;border-radius:11px;font-weight:700;font-size:14.5px;background:linear-gradient(180deg,var(--brick-2),var(--brick));color:#fff;border:none;cursor:pointer;box-shadow:0 8px 22px rgba(139,36,36,0.4)}
.btn-primary:hover{transform:translateY(-1px)}
.msg{margin-top:12px;font-size:13px;text-align:center}
.msg.err{color:#e76d6d}
.foot{text-align:center;color:var(--ink-3);font-size:12.5px;margin-top:20px}
.foot a{color:var(--gold-2)}
.lang-toggle{display:flex;justify-content:center;gap:6px;margin-bottom:18px}
.lang-toggle button{padding:6px 14px;border-radius:99px;font-size:11.5px;font-weight:700;color:var(--ink-3);border:1px solid var(--line-2);background:rgba(255,255,255,0.02)}
.lang-toggle button.active{background:linear-gradient(180deg,var(--green-2),var(--green));color:#fff;border-color:var(--green)}
.lang-toggle button:not(.active):hover{background:rgba(255,255,255,0.06);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand-row">
    <span class="brand-mark">
      <svg viewBox="0 0 100 100" width="26" height="26" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lg-roof" x1="20" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c93e3e"/><stop offset="1" stop-color="#7a1f1f"/></linearGradient>
          <linearGradient id="lg-smoke" x1="25" y1="4" x2="42" y2="34" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5bc05b"/><stop offset="1" stop-color="#2d7d2d"/></linearGradient>
        </defs>
        <path d="M22 30 C14 26 30 20 22 15 C15 11 28 6 22 3" stroke="url(#lg-smoke)" stroke-width="4.2" fill="none" stroke-linecap="round"/>
        <path d="M34 26 C28 23 38 18 32 15" stroke="url(#lg-smoke)" stroke-width="3.4" fill="none" stroke-linecap="round" opacity="0.85"/>
        <rect x="24" y="10" width="15" height="27" fill="url(#lg-roof)"/>
        <path d="M50 16 L86 47 L86 81 Q86 86 81 86 L19 86 Q14 86 14 81 L14 47 Z" fill="url(#lg-roof)"/>
        <rect x="29" y="49" width="34" height="30" rx="6" fill="#f4f4f2"/>
        <text x="46" y="73" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="30" fill="#111111" text-anchor="middle">R</text>
      </svg>
    </span>
    <span class="brand-word"><span class="b1">ent</span><span class="b3">pay</span><span class="b4">ez</span></span>
  </div>
  <div class="lang-toggle" id="langToggle">
    <button id="langBtnEn" onclick="setLang('en')">EN</button>
    <button id="langBtnEs" onclick="setLang('es')">ES</button>
  </div>
  <div class="sub" id="loginSub">Sign in with the email and temporary password your property manager gave you</div>

  <div class="card">
    <div class="field"><label id="lblEmail">Email</label><input id="li-email" type="email" placeholder="you@email.com" /></div>
    <div class="field"><label id="lblPassword">Password</label><input id="li-password" type="password" placeholder="••••••••" /></div>
    <button class="btn-primary" onclick="doLogin()" id="btnSignIn">Sign In</button>
    <div id="li-msg" class="msg"></div>
  </div>

  <p class="foot" id="footText">Property manager or staff? <a href="/admin/login.html">Sign in here instead</a></p>
</div>

<script>
const I18N_LOGIN = {
  en: { sub:'Sign in with the email and temporary password your property manager gave you', email:'Email', password:'Password', sign_in:'Sign In', login_failed:'Login failed', staff_prompt:'Property manager or staff? ', staff_link:'Sign in here instead' },
  es: { sub:'Inicia sesión con el correo y la contraseña temporal que te dio tu administrador de propiedad', email:'Correo electrónico', password:'Contraseña', sign_in:'Iniciar Sesión', login_failed:'No se pudo iniciar sesión', staff_prompt:'¿Administrador de propiedad o personal? ', staff_link:'Inicia sesión aquí' }
};
let LANG = localStorage.getItem('rpz_lang') === 'es' ? 'es' : 'en';
function applyLang(){
  const d = I18N_LOGIN[LANG];
  document.getElementById('loginSub').textContent = d.sub;
  document.getElementById('lblEmail').textContent = d.email;
  document.getElementById('lblPassword').textContent = d.password;
  document.getElementById('btnSignIn').textContent = d.sign_in;
  document.getElementById('footText').innerHTML = d.staff_prompt + '<a href="/admin/login.html">' + d.staff_link + '</a>';
  document.getElementById('langBtnEn').classList.toggle('active', LANG==='en');
  document.getElementById('langBtnEs').classList.toggle('active', LANG==='es');
}
function setLang(l){ LANG = l; localStorage.setItem('rpz_lang', l); applyLang(); }
applyLang();
async function doLogin(){
  const email = document.getElementById('li-email').value.trim();
  const password = document.getElementById('li-password').value;
  const msg = document.getElementById('li-msg');
  msg.className='msg'; msg.textContent='';
  try{
    const res = await fetch('/api/tenant-auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email,password}) });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || I18N_LOGIN[LANG].login_failed);
    window.location.href = 'portal.html';
  }catch(err){ msg.className='msg err'; msg.textContent = err.message; }
}
document.getElementById('li-password').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
